<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book details — Aurora</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="aurora-bg" aria-hidden="true">
    <span class="blob-1"></span>
    <span class="blob-2"></span>
    <span class="blob-3"></span>
    <span class="blob-4"></span>
    <span class="blob-5"></span>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <span class="brand-text">Aurora</span>
          <span class="brand-sub header-note" id="headerNote">Book details</span>
        </span>
      </a>
    </div>
  </header>

  <main id="main" class="container">
    <a href="index.html" class="btn btn-ghost back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      Back to catalogue
    </a>

    <div id="bookDetail"></div>

    <section class="detail-section" id="relatedSection" hidden>
      <h2 class="section-title" id="relatedTitle">More in this genre</h2>
      <ul class="related-strip-list book-grid" id="relatedStrip" aria-label="Related books"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Aurora — Glass Library Catalogue</p>
      <p>Variation E — Web Technology</p>
    </div>
  </footer>

  <section class="compare-tray glass" id="compareTray" aria-label="Compare tray" hidden>
    <div class="tray-covers" id="trayCovers"></div>
    <div class="tray-info">
      <p class="tray-count" id="trayCount"></p>
    </div>
    <div class="tray-actions">
      <button type="button" class="btn btn-ghost" id="trayClearBtn">Clear</button>
      <button type="button" class="btn btn-primary" id="trayCompareBtn" disabled>Compare</button>
    </div>
  </section>

  <p class="compare-toast" id="compareToast" role="status" aria-live="polite"></p>

  <div class="compare-modal-overlay" id="compareModalOverlay" hidden>
    <div class="compare-modal" role="dialog" aria-modal="true" aria-labelledby="compareModalTitle" id="compareModal">
      <div class="compare-modal-header">
        <h2 id="compareModalTitle">Compare books</h2>
        <button type="button" class="compare-modal-close" id="compareModalClose" aria-label="Close compare dialog">
          <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="compare-modal-body" id="compareModalBody"></div>
    </div>
  </div>

  <script src="js/books.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
